<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werewolf Party</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6999553446379672"
     crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Metal+Mania&family=Nosifer&display=swap" rel="stylesheet">
    <style>
        :root {
            --blood-red: #b91c1c;
            --deep-void: #050505;
            --parchment: #fdf5e6;
        }

        body {
            font-family: 'Metal Mania', cursive;
            background: black;
            color: #fca5a5;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            transition: background 2s ease;
        }

        .bg-night { background: radial-gradient(circle, #1a0b2e 0%, #050505 100%); }
        .bg-day { background: radial-gradient(circle, #450a0a 0%, #050505 100%); }
        .bg-voting { background: radial-gradient(circle, #2a2a2a 0%, #050505 100%); }

        .glass-panel {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(185, 28, 28, 0.3);
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        .card-container {
            perspective: 1000px;
            width: 260px;
            height: 380px;
            margin: 1rem auto;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .card-inner.is-flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 1rem;
            padding: 1.5rem;
            border: 8px solid #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .card-front { background: #111; color: #333; }
        .card-back { transform: rotateY(180deg); background: var(--parchment); color: #111; }

        .card-werewolf { border-color: #8b0000 !important; }
        .card-villager { border-color: #2d5a27 !important; }
        .card-seer { border-color: #4b0082 !important; }
        .card-doctor { border-color: #0047ab !important; }

        .player-grid {
            display: grid;
            gap: 0.5rem;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        }

        .log-entry {
            border-left: 3px solid var(--blood-red);
            padding-left: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            opacity: 0.8;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px var(--blood-red); }
            50% { box-shadow: 0 0 30px var(--blood-red); }
            100% { box-shadow: 0 0 10px var(--blood-red); }
        }

        .active-glow { animation: pulse-glow 2s infinite; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--blood-red); }
    </style>
</head>
<body class="bg-night">

    <div id="app" class="max-w-6xl mx-auto p-4 flex flex-col min-h-screen">
        <header class="text-center mb-4 pt-4">
            <div class="w-24 h-24 md:w-32 md:h-32 rounded-full mx-auto mb-2 overflow-hidden border-4 border-red-900 shadow-2xl bg-white">
                <img src="https://us.123rf.com/450wm/saifulislamssm/saifulislamssm2410/saifulislamssm241000120/301572872-wolf-in-bold-shield-shape-mascot-logo-vector-illustration-design.jpg?ver=6" 
                     alt="Wolf Mascot" class="w-full h-full object-contain" style="mix-blend-mode: multiply;">
            </div>
            <h1 class="text-4xl md:text-6xl font-['Creepster'] text-red-700 uppercase tracking-tighter">Werewolf</h1>
            <p class="text-red-500 text-xs tracking-widest opacity-60 font-['Metal_Mania'] uppercase">75-Player Ultra Deluxe</p>
        </header>

        <div id="main-stage" class="glass-panel rounded-[2rem] p-4 md:p-8 flex-grow mb-4 flex flex-col">
            <!-- Dynamic Content -->
        </div>

        <div id="game-log" class="glass-panel rounded-xl p-3 h-32 overflow-y-auto text-xs hidden">
            <h4 class="uppercase text-red-900 font-bold mb-2 border-b border-red-900/20">Book of Shadows (Game History)</h4>
            <div id="log-content"></div>
        </div>
    </div>

    <script>
        const ROLES = {
            WEREWOLF: { name: 'Werewolf', icon: '🐺', class: 'card-werewolf', color: 'text-red-800', desc: 'Tonight, hunt the innocent. Stay hidden by day.' },
            SEER: { name: 'Seer', icon: '👁️', class: 'card-seer', color: 'text-purple-900', desc: 'Peer into the soul of any player to reveal their true nature.' },
            DOCTOR: { name: 'Doctor', icon: '🧪', class: 'card-doctor', color: 'text-blue-900', desc: 'Protect one soul tonight. They shall not perish by wolf claws.' },
            VILLAGER: { name: 'Villager', icon: '👨‍🌾', class: 'card-villager', color: 'text-green-900', desc: 'Find the monsters hiding in human skin. Vote them out.' }
        };

        let GameState = {
            phase: 'SETUP', // SETUP, PRIVACY, ROLES, NIGHT_WOLF, NIGHT_SEER, NIGHT_DOCTOR, DAY_SUMMARY, DAY_VOTING
            players: [],
            currentTurnIndex: 0,
            nightActions: { killed: null, protected: null },
            dayResult: '',
            history: [],
            roleCounts: { werewolf: 1, seer: 1, doctor: 1 }
        };

        function speak(text) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.rate = 0.9;
            msg.pitch = 0.6;
            window.speechSynthesis.speak(msg);
        }

        function addLog(msg) {
            GameState.history.unshift(msg);
            const content = document.getElementById('log-content');
            if(content) {
                content.innerHTML = GameState.history.map(h => `<div class="log-entry">${h}</div>`).join('');
            }
        }

        function render() {
            const stage = document.getElementById('main-stage');
            const logPanel = document.getElementById('game-log');
            
            // Shift backgrounds
            document.body.className = GameState.phase.startsWith('NIGHT') ? 'bg-night' : 
                                     (GameState.phase.startsWith('DAY_VOTING') ? 'bg-voting' : 'bg-day');

            stage.innerHTML = '';
            if (GameState.phase === 'SETUP') renderSetup(stage);
            else if (GameState.phase === 'PRIVACY') renderPrivacy(stage);
            else if (GameState.phase === 'ROLES') renderRoles(stage);
            else if (GameState.phase.startsWith('NIGHT')) renderNight(stage);
            else if (GameState.phase === 'DAY_SUMMARY') renderSummary(stage);
            else if (GameState.phase === 'DAY_VOTING') renderVoting(stage);
            
            logPanel.classList.toggle('hidden', GameState.phase === 'SETUP');
        }

        function renderSetup(stage) {
            const totalUsed = GameState.roleCounts.werewolf + GameState.roleCounts.seer + GameState.roleCounts.doctor;
            const remainingVillagers = Math.max(0, GameState.players.length - totalUsed);

            stage.innerHTML = `
                <div class="space-y-4">
                    <h2 class="text-2xl font-['Nosifer'] text-center text-red-700">Victim Enrollment</h2>
                    <div class="flex flex-col md:flex-row gap-2">
                        <input id="p-input" placeholder="Enter Soul Name..." class="flex-1 bg-black/50 border border-red-900/50 p-3 rounded-lg focus:outline-none text-red-400">
                        <button onclick="addPlayer()" class="bg-red-900 px-6 py-3 rounded-lg font-bold hover:bg-red-700">ENROLL</button>
                    </div>

                    <div class="grid grid-cols-3 gap-2 bg-red-950/10 p-4 rounded-xl border border-red-900/20">
                        ${['werewolf', 'seer', 'doctor'].map(role => `
                            <div class="text-center">
                                <div class="text-[10px] uppercase opacity-50">${role}s</div>
                                <div class="flex items-center justify-center gap-2">
                                    <button onclick="adjRole('${role}', -1)" class="w-6 h-6 bg-red-900 rounded-full">-</button>
                                    <span class="text-xl">${GameState.roleCounts[role]}</span>
                                    <button onclick="adjRole('${role}', 1)" class="w-6 h-6 bg-red-900 rounded-full">+</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <p class="text-center text-[10px] text-green-700 font-bold">Auto-Villagers: ${remainingVillagers}</p>

                    <div class="player-grid max-h-48 overflow-y-auto p-2 border border-white/5 rounded-lg">
                        ${GameState.players.map((p, i) => `
                            <div class="bg-white/5 px-2 py-1 rounded flex justify-between items-center text-xs">
                                <span class="truncate">${p.name}</span>
                                <button onclick="removePlayer(${i})" class="text-red-900">×</button>
                            </div>
                        `).join('')}
                    </div>

                    <button onclick="initGame()" class="w-full bg-red-700 py-4 rounded-xl font-['Creepster'] text-3xl shadow-lg hover:bg-red-600 transition">INITIATE RITUAL</button>
                </div>
            `;
            document.getElementById('p-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') addPlayer(); });
        }

        function addPlayer() {
            const input = document.getElementById('p-input');
            const name = input.value.trim();
            if (name && GameState.players.length < 75) {
                GameState.players.push({ name, id: Date.now() + Math.random(), alive: true, role: null });
                input.value = '';
                render();
            }
        }

        function adjRole(r, d) { GameState.roleCounts[r] = Math.max(0, GameState.roleCounts[r] + d); render(); }
        function removePlayer(i) { GameState.players.splice(i, 1); render(); }

        function initGame() {
            if(GameState.players.length < 4) return;
            
            // Assign roles
            let pool = [];
            for(let i=0; i<GameState.roleCounts.werewolf; i++) pool.push('WEREWOLF');
            for(let i=0; i<GameState.roleCounts.seer; i++) pool.push('SEER');
            for(let i=0; i<GameState.roleCounts.doctor; i++) pool.push('DOCTOR');
            while(pool.length < GameState.players.length) pool.push('VILLAGER');
            
            pool = pool.sort(() => Math.random() - 0.5);
            GameState.players.forEach((p, i) => p.role = pool[i]);

            GameState.phase = 'PRIVACY';
            GameState.currentTurnIndex = 0;
            addLog("The Ritual has begun.");
            render();
        }

        function renderPrivacy(stage) {
            const p = GameState.players[GameState.currentTurnIndex];
            stage.innerHTML = `
                <div class="text-center space-y-8 py-10">
                    <h2 class="text-xl uppercase opacity-50">Private Reveal</h2>
                    <div class="text-5xl font-['Nosifer'] text-white">${p.name}</div>
                    <div class="p-8 bg-red-950/20 border border-red-900/30 rounded-2xl italic">
                        Pass the device to ${p.name}. <br>No one else should be looking.
                    </div>
                    <button onclick="GameState.phase='ROLES'; render();" class="w-full max-w-xs bg-red-800 py-4 rounded-xl font-bold uppercase active-glow">I AM ${p.name}</button>
                </div>
            `;
        }

        function renderRoles(stage) {
            const p = GameState.players[GameState.currentTurnIndex];
            const r = ROLES[p.role];
            stage.innerHTML = `
                <div class="text-center space-y-4">
                    <h2 class="text-sm opacity-50 uppercase">Identity Confirmed</h2>
                    
                    <div class="card-container" onclick="this.querySelector('.card-inner').classList.toggle('is-flipped')">
                        <div class="card-inner">
                            <div class="card-face card-front">
                                <div class="text-6xl opacity-10">?</div>
                                <div class="text-[10px] uppercase tracking-widest">Tap to Reveal</div>
                            </div>
                            <div class="card-face card-back ${r.class}">
                                <div class="w-full text-center py-2 font-['Nosifer'] uppercase text-lg border-b-2 border-black/10">${r.name}</div>
                                <div class="text-8xl">${r.icon}</div>
                                <div class="p-2 italic text-[10px] border border-black/5 rounded">"${r.desc}"</div>
                            </div>
                        </div>
                    </div>

                    <button onclick="finishRoleReveal()" class="bg-black border border-red-900 px-10 py-3 rounded-full text-sm font-bold hover:bg-red-950">MY FATE IS SEALED</button>
                </div>
            `;
        }

        function finishRoleReveal() {
            GameState.currentTurnIndex++;
            if(GameState.currentTurnIndex < GameState.players.length) {
                GameState.phase = 'PRIVACY';
            } else {
                startNight();
            }
            render();
        }

        function startNight() {
            GameState.nightActions = { killed: null, protected: null };
            speak("Everyone, close your eyes. The shadows are lengthening.");
            GameState.phase = 'NIGHT_WOLF';
            addLog("Night falls over the village.");
            render();
        }

        function renderNight(stage) {
            let roleTitle = "Werewolves";
            let instructions = "Choose your prey.";
            let currentRoleKey = 'WEREWOLF';

            if(GameState.phase === 'NIGHT_SEER') { roleTitle = "Seer"; instructions = "Peak into a soul."; currentRoleKey = 'SEER'; }
            if(GameState.phase === 'NIGHT_DOCTOR') { roleTitle = "Doctor"; instructions = "Who shall you save?"; currentRoleKey = 'DOCTOR'; }

            const alive = GameState.players.filter(p => p.alive);
            const r = ROLES[currentRoleKey];

            stage.innerHTML = `
                <div class="space-y-4 text-center">
                    <div class="nosifer text-red-600 text-2xl animate-pulse">${r.icon} ${roleTitle}</div>
                    <p class="text-xs italic opacity-50">${instructions}</p>

                    <div class="player-grid max-h-[50vh] overflow-y-auto pr-2">
                        ${alive.map(p => `
                            <button onclick="handleNightAction('${currentRoleKey}', ${p.id})" class="bg-red-950/20 border border-red-900/30 p-3 rounded-lg text-xs hover:bg-red-700 transition">
                                ${p.name}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function handleNightAction(role, targetId) {
            const target = GameState.players.find(p => p.id === targetId);
            if(role === 'WEREWOLF') GameState.nightActions.killed = targetId;
            if(role === 'DOCTOR') GameState.nightActions.protected = targetId;
            if(role === 'SEER') {
                const isWolf = target.role === 'WEREWOLF';
                addLog(`Seer peered at ${target.name}.`);
                stageModal("Spirit Mirror", `${target.name} is ${isWolf ? 'A WEREWOLF!' : 'Innocent.'}`);
                return;
            }
            advanceNight();
        }

        function advanceNight() {
            if(GameState.phase === 'NIGHT_WOLF') {
                if(GameState.roleCounts.seer > 0 && GameState.players.some(p => p.role === 'SEER' && p.alive)) GameState.phase = 'NIGHT_SEER';
                else if(GameState.roleCounts.doctor > 0 && GameState.players.some(p => p.role === 'DOCTOR' && p.alive)) GameState.phase = 'NIGHT_DOCTOR';
                else processDawn();
            } else if(GameState.phase === 'NIGHT_SEER') {
                if(GameState.roleCounts.doctor > 0 && GameState.players.some(p => p.role === 'DOCTOR' && p.alive)) GameState.phase = 'NIGHT_DOCTOR';
                else processDawn();
            } else {
                processDawn();
            }
            render();
        }

        function processDawn() {
            const { killed, protected } = GameState.nightActions;
            let msg = "The sun rises on a quiet village. No one was harmed.";
            if (killed && killed !== protected) {
                const victim = GameState.players.find(p => p.id === killed);
                victim.alive = false;
                msg = `${victim.name} was slaughtered in the night. Blood was found everywhere.`;
            } else if (killed && killed === protected) {
                msg = "A struggle took place, but the Doctor's healing hands saved the victim.";
            }
            GameState.dayResult = msg;
            GameState.phase = 'DAY_SUMMARY';
            addLog(msg);
            speak(msg);
        }

        function renderSummary(stage) {
            stage.innerHTML = `
                <div class="text-center space-y-8 py-10">
                    <h2 class="text-5xl font-['Creepster'] text-red-600">Daybreak</h2>
                    <div class="p-6 bg-red-950/20 rounded-2xl text-xl italic leading-relaxed border-y border-red-900/30">
                        "${GameState.dayResult}"
                    </div>
                    <button onclick="GameState.phase='DAY_VOTING'; render();" class="w-full bg-red-800 py-4 rounded-xl font-['Creepster'] text-3xl active-glow">TOWN ASSEMBLY</button>
                </div>
            `;
        }

        function renderVoting(stage) {
            const alive = GameState.players.filter(p => p.alive);
            stage.innerHTML = `
                <div class="space-y-4 text-center">
                    <h2 class="text-3xl font-['Nosifer'] text-red-700">The Gallows</h2>
                    <p class="text-xs opacity-50 uppercase tracking-widest">Who shall pay for these crimes?</p>
                    
                    <div class="player-grid max-h-[50vh] overflow-y-auto">
                        ${alive.map(p => `
                            <button onclick="executePlayer(${p.id})" class="bg-black/50 border border-red-900/50 p-4 rounded-xl hover:border-red-500 transition group">
                                <span class="text-sm font-bold text-gray-400 group-hover:text-red-500">${p.name}</span>
                            </button>
                        `).join('')}
                    </div>

                    <div class="flex gap-2">
                        <button onclick="startNight()" class="flex-1 bg-gray-900 py-3 rounded-lg text-xs font-bold border border-white/5">ABSTAIN (SKIP DAY)</button>
                    </div>
                </div>
            `;
        }

        function executePlayer(id) {
            const p = GameState.players.find(x => x.id === id);
            p.alive = false;
            addLog(`${p.name} (${p.role}) was sent to the gallows.`);
            speak(`${p.name} has been lynched.`);
            if(!checkWin()) startNight();
        }

        function checkWin() {
            const w = GameState.players.filter(p => p.role === 'WEREWOLF' && p.alive).length;
            const v = GameState.players.filter(p => p.role !== 'WEREWOLF' && p.alive).length;
            
            if (w === 0) { renderVictory('Villagers'); return true; }
            if (w >= v) { renderVictory('Werewolves'); return true; }
            return false;
        }

        function renderVictory(side) {
            const stage = document.getElementById('main-stage');
            stage.innerHTML = `
                <div class="text-center space-y-8 py-10">
                    <div class="text-9xl">${side === 'Werewolves' ? '🐺' : '🏘️'}</div>
                    <h2 class="text-6xl font-['Nosifer'] ${side === 'Werewolves' ? 'text-red-700' : 'text-blue-700'}">${side} Win!</h2>
                    <p class="italic text-gray-500">The cycle of blood is complete.</p>
                    <button onclick="location.reload()" class="bg-red-900 px-10 py-4 rounded-full font-bold">REBIRTH</button>
                </div>
            `;
        }

        function stageModal(title, text) {
            const stage = document.getElementById('main-stage');
            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 bg-black/95 flex items-center justify-center p-6 z-[100]";
            overlay.innerHTML = `
                <div class="glass-panel p-8 rounded-3xl text-center max-w-sm w-full space-y-6">
                    <h3 class="text-2xl font-['Nosifer'] text-red-600">${title}</h3>
                    <p class="text-lg italic">${text}</p>
                    <button id="modal-close" class="w-full bg-red-900 py-4 rounded-xl font-bold uppercase">I have seen enough</button>
                </div>
            `;
            document.body.appendChild(overlay);
            document.getElementById('modal-close').onclick = () => {
                overlay.remove();
                advanceNight();
            };
        }

        window.onload = render;
    </script>
</body>
</html>
