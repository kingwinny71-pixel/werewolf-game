<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werewolf: Ultra Horror Edition</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6999553446379672"
     crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Metal+Mania&family=Nosifer&display=swap" rel="stylesheet">
    <style>
        :root {
            --blood-red: #b91c1c;
            --deep-void: #0a0a0a;
        }

        body {
            font-family: 'Metal Mania', cursive;
            background: 
                linear-gradient(rgba(10, 10, 10, 0.9), rgba(139, 0, 0, 0.4)), 
                url('https://media.istockphoto.com/id/963342958/vector/bloody-grunge-abstract-texture-background.jpg?s=612x612&w=0&k=20&c=zmVuVv34fH2iW4qV094IijYSPW-4VVVOp5gtZekWMbs=');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fca5a5;
            min-height: 100vh;
            overflow-x: hidden;
            margin: 0;
        }

        .card-container {
            perspective: 1000px;
            width: 280px;
            height: 400px;
            margin: 0 auto;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 4px solid var(--blood-red);
            box-shadow: 0 0 30px rgba(185, 28, 28, 0.4);
        }

        .card-front {
            background: linear-gradient(135deg, #262626 0%, #000 100%);
        }

        .card-back {
            background: linear-gradient(135deg, #1a1a1a 0%, #450a0a 100%);
            transform: rotateY(180deg);
        }

        .spooky-glow {
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
        }

        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 15px rgba(185, 28, 28, 0.5); }
            50% { box-shadow: 0 0 40px rgba(185, 28, 28, 0.8); }
        }

        .animate-pulse-red { animation: pulse-red 2s infinite; }

        .night-mode {
            filter: grayscale(0.5) contrast(1.2) brightness(0.7);
            background: #000;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--blood-red); border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8 flex items-center justify-center min-h-screen">
    
    <div id="app" class="w-full max-w-2xl mx-auto relative z-10 transition-all duration-1000">
        <header class="text-center mb-10 flex flex-col items-center">
            <div class="relative group w-40 h-40 md:w-56 md:h-56 mb-6">
                <div class="absolute inset-0 bg-red-600/30 blur-[40px] rounded-full animate-pulse scale-110"></div>
                <div class="relative w-full h-full rounded-full border-4 border-red-900 bg-gray-200 overflow-hidden shadow-[0_0_50px_rgba(139,0,0,0.6)] flex items-center justify-center">
                    <img 
                        src="https://us.123rf.com/450wm/saifulislamssm/saifulislamssm2410/saifulislamssm241000120/301572872-wolf-in-bold-shield-shape-mascot-logo-vector-illustration-design.jpg?ver=6" 
                        alt="Werewolf Mascot" 
                        class="w-[85%] h-[85%] object-contain transition-transform duration-700 group-hover:scale-110 group-hover:rotate-3"
                        style="mix-blend-mode: multiply;"
                    >
                </div>
            </div>
            <h1 class="text-6xl md:text-8xl font-['Creepster'] text-red-700 drop-shadow-[0_0_15px_rgba(185,28,28,0.5)] mb-2 tracking-widest">WEREWOLF</h1>
            <p id="narrator-subtitle" class="text-red-500 italic text-lg opacity-80">The Digital Narrator Awaits...</p>
        </header>

        <div id="view-container" class="bg-black/85 backdrop-blur-xl rounded-[2.5rem] p-6 md:p-12 border border-red-900/40 shadow-2xl transition-all duration-700">
            <!-- Dynamic Screens -->
        </div>

        <footer class="mt-8 text-center">
            <div id="game-status-footer" class="text-red-900 text-sm tracking-[0.3em] uppercase opacity-50"></div>
        </footer>
    </div>

    <script>
        const GameState = {
            phase: 'SETUP',
            players: [],
            logs: [],
            nightActions: { killed: null, protected: null, checked: null },
            currentTurnIndex: 0,
            winner: null,
            audioInitialized: false,
            heartbeat: null
        };

        const ROLES = {
            WEREWOLF: { name: 'Werewolf', icon: '🐺', color: 'text-red-600', desc: 'Sow chaos. Kill one villager each night.' },
            SEER: { name: 'Seer', icon: '👁️', color: 'text-purple-500', desc: 'The eyes in the dark. Peek at one player\'s true nature.' },
            DOCTOR: { name: 'Doctor', icon: '🧪', color: 'text-green-500', desc: 'A beacon of hope. Shield one soul from death.' },
            VILLAGER: { name: 'Villager', icon: '👨‍🌾', color: 'text-blue-500', desc: 'Strength in numbers. Find the beasts among you.' }
        };

        async function speak(text) {
            try {
                const payload = {
                    contents: [{ parts: [{ text: `Say in a deep, gravelly, spooky horror narrator voice: ${text}` }] }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Algenib" } } }
                    },
                    model: "gemini-2.5-flash-preview-tts"
                };

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                const audioData = result?.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                const mimeType = result?.candidates?.[0]?.content?.parts?.[0]?.inlineData?.mimeType;

                if (audioData) {
                    const sampleRate = parseInt(mimeType.match(/rate=(\d+)/)[1], 10);
                    const binary = atob(audioData);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                    const pcm16 = new Int16Array(bytes.buffer);
                    const wavBlob = pcmToWav(pcm16, sampleRate);
                    const audio = new Audio(URL.createObjectURL(wavBlob));
                    audio.play();
                }
            } catch (e) {
                console.error("TTS failed", e);
            }
        }

        function pcmToWav(pcm16, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcm16.length * 2);
            const view = new DataView(buffer);
            const writeString = (offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };
            writeString(0, 'RIFF'); view.setUint32(4, 36 + pcm16.length * 2, true); writeString(8, 'WAVE');
            writeString(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true);
            view.setUint16(34, 16, true); writeString(36, 'data'); view.setUint32(40, pcm16.length * 2, true);
            for (let i = 0; i < pcm16.length; i++) view.setInt16(44 + i * 2, pcm16[i], true);
            return new Blob([buffer], { type: 'audio/wav' });
        }

        async function initAudio() {
            if (GameState.audioInitialized) return;
            await Tone.start();
            GameState.audioInitialized = true;
            
            // Create a creepy heartbeat drone
            GameState.heartbeat = new Tone.MembraneSynth({
                pitchDecay: 0.05,
                octaves: 4,
                oscillator: { type: "sine" }
            }).toDestination();
        }

        function playHeartbeat(bpm = 60) {
            if (!GameState.audioInitialized) return;
            Tone.Transport.cancel();
            Tone.Transport.scheduleRepeat((time) => {
                GameState.heartbeat.triggerAttackRelease("C1", "8n", time, 0.3);
            }, "4n");
            Tone.Transport.bpm.value = bpm;
            Tone.Transport.start();
        }

        function stopHeartbeat() {
            Tone.Transport.stop();
        }

        function render() {
            const container = document.getElementById('view-container');
            const app = document.getElementById('app');
            container.innerHTML = '';
            
            // Background shifts for Night
            if (GameState.phase.startsWith('NIGHT')) {
                app.classList.add('night-mode');
            } else {
                app.classList.remove('night-mode');
            }

            switch(GameState.phase) {
                case 'SETUP': renderSetup(container); break;
                case 'ROLES': renderRoleDistribution(container); break;
                case 'NIGHT_WOLF': renderNightPhase(container, 'WEREWOLF'); break;
                case 'NIGHT_SEER': renderNightPhase(container, 'SEER'); break;
                case 'NIGHT_DOCTOR': renderNightPhase(container, 'DOCTOR'); break;
                case 'DAY_SUMMARY': renderDaySummary(container); break;
                case 'DAY_VOTING': renderDayVoting(container); break;
                case 'GAME_OVER': renderGameOver(container); break;
            }
            
            updateFooter();
        }

        function renderSetup(container) {
            container.innerHTML = `
                <div class="space-y-8">
                    <h2 class="text-4xl font-['Nosifer'] text-center text-red-600 mb-8">The Sacrificial List</h2>
                    <div class="flex gap-4">
                        <input id="new-player-name" type="text" placeholder="Who joins the feast?" class="flex-1 bg-black/50 border-2 border-red-900 rounded-2xl px-6 py-4 focus:outline-none focus:ring-4 focus:ring-red-600/20 transition text-red-400 text-2xl font-['Metal_Mania']">
                        <button onclick="addPlayer()" class="bg-red-800 hover:bg-red-600 text-white px-8 rounded-2xl font-bold transition-all transform active:scale-95 shadow-[0_0_15px_rgba(185,28,28,0.4)]">ADD</button>
                    </div>
                    <div id="player-list" class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-72 overflow-y-auto p-2">
                        ${GameState.players.map((p, i) => `
                            <div class="group flex justify-between items-center bg-red-900/10 p-4 rounded-2xl border border-red-900/30 hover:border-red-600 transition-all">
                                <span class="text-2xl text-gray-100 group-hover:text-red-500">${p.name}</span>
                                <button onclick="removePlayer(${i})" class="text-red-900 hover:text-red-500 text-2xl">✕</button>
                            </div>
                        `).join('')}
                    </div>
                    <div class="pt-6">
                        ${GameState.players.length < 5 ? 
                            `<p class="text-center text-red-900 italic text-xl animate-pulse">Wait. ${5 - GameState.players.length} more are required...</p>` : 
                            `<button onclick="startRolesPhase()" class="w-full bg-gradient-to-r from-red-900 to-red-700 hover:from-red-700 hover:to-red-600 py-6 rounded-3xl text-4xl font-['Creepster'] uppercase tracking-[0.2em] transition-all transform hover:scale-105 shadow-[0_0_40px_rgba(185,28,28,0.6)]">Begin the Ritual</button>`
                        }
                    </div>
                </div>
            `;
            document.getElementById('new-player-name')?.focus();
        }

        async function startRolesPhase() {
            await initAudio();
            assignRoles();
            GameState.phase = 'ROLES';
            GameState.currentTurnIndex = 0;
            speak("Hand the device to " + GameState.players[0].name + " to reveal their secret identity.");
            render();
        }

        function renderRoleDistribution(container) {
            const player = GameState.players[GameState.currentTurnIndex];
            const roleData = ROLES[player.role.toUpperCase()];
            
            container.innerHTML = `
                <div class="text-center space-y-12 py-6">
                    <div class="space-y-2">
                        <h2 class="text-3xl text-red-900 uppercase tracking-tighter">Current Vessel</h2>
                        <div class="text-7xl font-['Nosifer'] text-white drop-shadow-lg">${player.name}</div>
                    </div>

                    <div class="card-container mx-auto" onclick="this.querySelector('.card-inner').classList.toggle('is-flipped')">
                        <div class="card-inner">
                            <div class="card-face card-front">
                                <span class="text-8xl opacity-20">?</span>
                                <p class="mt-4 text-red-900 font-bold uppercase tracking-widest">Tap to Flip</p>
                            </div>
                            <div class="card-face card-back">
                                <span class="text-9xl mb-6">${roleData.icon}</span>
                                <h3 class="text-5xl font-['Nosifer'] ${roleData.color}">${roleData.name}</h3>
                                <p class="mt-6 px-8 text-lg italic text-gray-300 leading-tight">"${roleData.desc}"</p>
                            </div>
                        </div>
                    </div>

                    <button onclick="nextRole()" class="bg-black border-2 border-red-900 px-12 py-5 rounded-full text-2xl hover:bg-red-900/20 transition-all font-['Creepster'] tracking-widest text-red-700">I AM COMMITTED</button>
                </div>
            `;
        }

        function renderNightPhase(container, roleType) {
            const roleData = ROLES[roleType];
            const alivePlayers = GameState.players.filter(p => p.alive);
            
            let actionText = "";
            if (roleType === 'WEREWOLF') actionText = "Whom shall we slaughter?";
            if (roleType === 'SEER') actionText = "Whose soul shall I peer into?";
            if (roleType === 'DOCTOR') actionText = "Who deserves protection tonight?";

            container.innerHTML = `
                <div class="space-y-8 text-center">
                    <div class="flex flex-col items-center">
                        <span class="text-8xl mb-4 opacity-80">${roleData.icon}</span>
                        <h2 class="text-5xl font-['Nosifer'] ${roleData.color} uppercase">${roleData.name} Awakening</h2>
                        <p class="text-xl text-gray-500 italic mt-2">${actionText}</p>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        ${alivePlayers.map(p => `
                            <button onclick="handleNightAction('${roleType}', ${p.id})" class="bg-red-900/10 hover:bg-red-700/40 border border-red-900/50 p-5 rounded-2xl transition-all group">
                                <span class="text-2xl text-gray-300 group-hover:text-white font-['Metal_Mania']">${p.name}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function handleNightAction(role, targetId) {
            if (role === 'WEREWOLF') GameState.nightActions.killed = targetId;
            if (role === 'SEER') {
                const target = GameState.players.find(p => p.id === targetId);
                alert(`${target.name} is a ${target.role}!`); // UI fallback
            }
            if (role === 'DOCTOR') GameState.nightActions.protected = targetId;

            advanceNight();
        }

        async function advanceNight() {
            if (GameState.phase === 'NIGHT_WOLF') {
                if (GameState.players.some(p => p.role === 'Seer' && p.alive)) {
                    GameState.phase = 'NIGHT_SEER';
                    speak("The werewolves have fed. Seer, open your eyes and find the truth.");
                } else {
                    GameState.phase = 'NIGHT_DOCTOR'; // Skip Seer
                    speak("The werewolves have fed. Doctor, wake up and save a life.");
                }
            } else if (GameState.phase === 'NIGHT_SEER') {
                if (GameState.players.some(p => p.role === 'Doctor' && p.alive)) {
                    GameState.phase = 'NIGHT_DOCTOR';
                    speak("Seer, return to sleep. Doctor, wake up.");
                } else {
                    processNightEnd();
                }
            } else {
                processNightEnd();
            }
            render();
        }

        function processNightEnd() {
            const { killed, protected } = GameState.nightActions;
            let result = "A quiet night has passed.";
            
            if (killed && killed !== protected) {
                const victim = GameState.players.find(p => p.id === killed);
                victim.alive = false;
                result = `Horror has struck! ${victim.name} was found shredded in the town square.`;
            } else if (killed && killed === protected) {
                result = "The Doctor's swift action saved a life tonight! No one died.";
            }

            GameState.phase = 'DAY_SUMMARY';
            GameState.dayResult = result;
            speak("The sun rises. " + result);
            checkGameOver();
        }

        function renderDayVoting(container) {
            playHeartbeat(80);
            container.innerHTML = `
                <div class="space-y-8 text-center">
                    <h2 class="text-5xl font-['Creepster'] text-red-600 animate-pulse">The Council of Suspicion</h2>
                    <p class="text-xl text-gray-500 italic">Discussion is mandatory. Death is optional.</p>
                    
                    <div class="grid grid-cols-2 gap-4">
                        ${GameState.players.filter(p => p.alive).map(p => `
                            <button onclick="lynchPlayer(${p.id})" class="bg-black border-2 border-red-950 p-6 rounded-3xl hover:border-red-600 transition-all group transform hover:-translate-y-1">
                                <span class="text-3xl font-['Metal_Mania'] text-red-200 group-hover:text-red-500">${p.name}</span>
                                <div class="text-[10px] uppercase opacity-0 group-hover:opacity-100 text-red-800 font-bold tracking-tighter mt-1">Send to Gallows</div>
                            </button>
                        `).join('')}
                    </div>

                    <button onclick="skipDay()" class="w-full bg-gray-900 border border-gray-800 text-gray-500 py-4 rounded-2xl hover:text-red-700 transition font-['Creepster']">The Day Ends in Standoff</button>
                </div>
            `;
        }

        function lynchPlayer(id) {
            const p = GameState.players.find(x => x.id === id);
            p.alive = false;
            stopHeartbeat();
            speak(`The village has spoken. ${p.name}, a ${p.role}, has been executed.`);
            if (!checkGameOver()) {
                startNight();
            }
        }

        function startNight() {
            GameState.phase = 'NIGHT_WOLF';
            GameState.nightActions = { killed: null, protected: null, checked: null };
            speak("The sun sets. Everyone, close your eyes. Werewolves, wake up.");
            render();
        }

        function checkGameOver() {
            const wolves = GameState.players.filter(p => p.role === 'Werewolf' && p.alive).length;
            const villagers = GameState.players.filter(p => p.role !== 'Werewolf' && p.alive).length;

            if (wolves === 0) {
                GameState.phase = 'GAME_OVER';
                GameState.winner = 'VILLAGERS';
                render();
                return true;
            }
            if (wolves >= villagers) {
                GameState.phase = 'GAME_OVER';
                GameState.winner = 'WEREWOLVES';
                render();
                return true;
            }
            return false;
        }

        // Helper: Initialize role assignment
        function assignRoles() {
            const count = GameState.players.length;
            let roles = ['Werewolf', 'Seer', 'Doctor', 'Villager', 'Villager'];
            if (count > 5) roles.push('Villager');
            if (count > 6) roles.push('Werewolf');
            if (count > 7) roles.push('Villager');
            if (count > 8) roles.push('Villager');
            if (count > 9) roles.push('Villager');
            if (count > 10) roles.push('Villager');
            if (count > 11) roles.push('Werewolf');

            roles = roles.sort(() => Math.random() - 0.5);
            GameState.players.forEach((p, i) => p.role = roles[i]);
        }

        function nextRole() {
            GameState.currentTurnIndex++;
            if (GameState.currentTurnIndex < GameState.players.length) {
                speak("Pass the device to " + GameState.players[GameState.currentTurnIndex].name);
                render();
            } else {
                startNight();
            }
        }

        function updateFooter() {
            const alive = GameState.players.filter(p => p.alive).length;
            const total = GameState.players.length;
            const footer = document.getElementById('game-status-footer');
            if (total > 0) footer.innerText = `Souls Remaining: ${alive} / ${total}`;
        }

        // Generic logic fallbacks
        function addPlayer() {
            const input = document.getElementById('new-player-name');
            const name = input.value.trim();
            if (name && GameState.players.length < 12) {
                GameState.players.push({ name, role: null, alive: true, id: Date.now() });
                input.value = '';
                render();
            }
        }
        function removePlayer(idx) { GameState.players.splice(idx, 1); render(); }
        function renderDaySummary(container) {
            container.innerHTML = `
                <div class="text-center space-y-10 py-10">
                    <h2 class="text-5xl font-['Nosifer'] text-red-600">The Morning Report</h2>
                    <p class="text-3xl text-gray-200 italic font-['Metal_Mania'] max-w-lg mx-auto">"${GameState.dayResult}"</p>
                    <button onclick="GameState.phase = 'DAY_VOTING'; render();" class="bg-red-900 text-white px-12 py-5 rounded-3xl text-3xl font-['Creepster'] hover:bg-red-600 transition-all shadow-xl">Assemble the Council</button>
                </div>
            `;
        }
        function skipDay() { stopHeartbeat(); startNight(); }
        function renderGameOver(container) {
            const win = GameState.winner === 'WEREWOLVES';
            container.innerHTML = `
                <div class="text-center space-y-12 py-10">
                    <div class="text-9xl animate-bounce">${win ? '🐺' : '🏘️'}</div>
                    <h2 class="text-8xl font-['Nosifer'] ${win ? 'text-red-700' : 'text-blue-700'}">${win ? 'PACK VICTORY' : 'VILLAGE SAVED'}</h2>
                    <p class="text-2xl text-gray-500 font-['Creepster'] tracking-widest">The cycle of blood is complete.</p>
                    <button onclick="location.reload()" class="w-full bg-red-900 py-6 rounded-3xl text-4xl font-['Creepster'] text-white hover:bg-red-600 transition-all shadow-2xl">Resurrect Game</button>
                </div>
            `;
        }

        window.onload = render;
    </script>
</body>
</html>
